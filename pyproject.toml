[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-voyageur"
version = "0.1.0"
description = "pytest plugin that heals drifted Playwright locators through a Voyageur service, under strict client-side safety checks."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "PMAC"}]
requires-python = ">=3.10"
keywords = ["pytest", "playwright", "locator", "self-healing", "flaky-tests"]
classifiers = [
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=7.4",
    "pytest-playwright>=0.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
# the in-process service the end-to-end and contract tests run against (needs Python 3.12)
dev = [
    "voyageur @ git+https://github.com/philmcneely/voyageur@284b129",
    "uvicorn>=0.30",
    "pytest-xdist>=3.5",
]

# pytest finds the plugin through this entry point: `pip install pytest-voyageur` is all it takes
[project.entry-points.pytest11]
voyageur = "pytest_voyageur.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pytest_voyageur = ["probe.js", "probe.sha256"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p pytester"
markers = [
    "unit: offline unit tests",
    "browser: needs Playwright and a chromium build (skipped when they are not installed)",
]
